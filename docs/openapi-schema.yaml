          description: 'Ordered list of steps e.g. [{''step'': 1, ''role'': ''line-manager'',
            ''sla_hours'': 24}, {''step'': 2, ''role'': ''hr-director'', ''sla_hours'':
            48}]'
      required:
      - code
      - module_number
      - name
      - request_type
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
