openapi: 3.0.3
info:
  title: NICE HRIS — Multi-Tenant HRM SaaS API
  version: 1.0.0
  description: Bangladesh-first, multi-tenant Human Resource Management SaaS REST
    API (/api/v1/). Supports single-company and multi-company tenants, 42 HRM modules,
    API keys, and webhooks.
