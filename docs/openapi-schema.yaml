components:
  schemas:
    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        key_prefix:
          type: string
          readOnly: true
        scopes:
          description: List of module scopes e.g. ['employees:read', 'attendance:write']
        ip_allowlist:
          type: string
          description: Comma-separated allowed IPv4/IPv6 addresses
          maxLength: 500
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_active:
          type: boolean
        raw_key:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - key_prefix
      - last_used_at
      - name
      - raw_key
      - revoked_at
    APIKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          description: List of module scopes e.g. ['employees:read', 'attendance:write']
        ip_allowlist:
          type: string
          description: Comma-separated allowed IPv4/IPv6 addresses
          maxLength: 500
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
      required:
      - name
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        company_name:
          type: string
          readOnly: true
        department:
          type: string
          format: uuid
          nullable: true
        department_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        title_bn:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 40
        body:
          type: string
        is_pinned:
          type: boolean
        published_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - company
      - company_name
      - department_name
      - id
      - published_at
      - title
    AnnouncementRequest:
      type: object
      properties:
        company:
          type: string
          format: uuid
        department:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 200
        title_bn:
          type: string
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 40
        body:
          type: string
          minLength: 1
        is_pinned:
          type: boolean
      required:
      - body
      - company
      - title
    ApprovalDecision:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        step_number:
          type: integer
          maximum: 32767
          minimum: 0
        actor_employee:
          type: string
          format: uuid
          nullable: true
        actor_name:
          type: string
          readOnly: true
        decision:
          type: string
          maxLength: 20
        comments:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor_name
      - created_at
      - decision
      - id
    ApprovalDecisionRequest:
      type: object
      properties:
        step_number:
          type: integer
          maximum: 32767
          minimum: 0
        actor_employee:
          type: string
          format: uuid
          nullable: true
        decision:
          type: string
          minLength: 1
          maxLength: 20
        comments:
          type: string
      required:
      - decision
    ApprovalRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        company_name:
          type: string
          readOnly: true
        workflow:
          type: string
          format: uuid
        module_number:
          type: integer
          maximum: 32767
          minimum: 0
        subject_type:
          type: string
          maxLength: 80
        subject_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 220
        requester_employee:
          type: string
          format: uuid
        requester_name:
          type: string
          readOnly: true
        current_approver:
          type: string
          format: uuid
          nullable: true
        current_approver_name:
          type: string
          readOnly: true
        current_step:
          type: integer
          maximum: 32767
          minimum: 0
        total_steps:
          type: integer
