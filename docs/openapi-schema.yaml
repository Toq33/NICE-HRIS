          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DataScopeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataScope'
          description: ''
